[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlogs-sdk"
version = "0.1.1"
description = "Python SDK for AgentLogs — open-source observability for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ai", "agents", "observability", "tracing", "llm", "monitoring", "langchain", "crewai"]
authors = [
  { name = "AgentLogs", email = "info.siva@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "black>=24.0.0",
  "mypy>=1.8.0",
  "ruff>=0.2.0",
  "build>=1.0.0",
  "twine>=5.0.0",
]
langchain = ["langchain>=0.1.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]

[project.urls]
Homepage = "https://agentlogs.app"
Documentation = "https://agentlogs.app/docs"
Repository = "https://github.com/infosiva/agenttrace"
Issues = "https://github.com/infosiva/agenttrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlogs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
